name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.config/godot

      - name: Debug keystore
        run: base64 -d debug.keystore.b64 > debug.keystore

      - name: Editor settings
        run: |
          JAVA_BIN=$(readlink -f $(which jarsigner))
          JAVA_DIR=$(dirname $(dirname $JAVA_BIN))
          echo "Java: $JAVA_DIR"
          for n in 4 4.3; do
          cat > ~/.config/godot/editor_settings-$n.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Diagnose
        run: |
          echo "--- settings"
          cat ~/.config/godot/editor_settings-4.3.tres
          echo "--- keystore"
          ls -la debug.keystore
          echo "--- sdk"
          ls /usr/lib/android-sdk
          ls /usr/lib/android-sdk/build-tools
          ls /usr/lib/android-sdk/platforms
          ls /usr/lib/android-sdk/cmdline-tools
          echo "--- templates"
          ls ~/.local/share/godot/export_templates/4.3.stable
          echo "--- java"
          java -version 2>&1

      - name: Export APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/blockgame.apk 2>&1 | grep -v "is not exposed"

      - uses: actions/upload-artifact@v4
        with:
          name: blockgame-apk
          path: build/blockgame.apk